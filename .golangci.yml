version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true
  build-tags:
    - containers_image_openpgp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - copyloopvar
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    # goconst 1.11 and staticcheck 0.8 (golangci-lint v2.13) are noisier than v2.5.
    goconst:
      min-len: 3
      min-occurrences: 3
      exclude-types:
        - Call
        - CompositeLit
    prealloc:
      simple: true
      range-loops: false
      for-loops: false
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: disable
    rules:
      - path: internal/.*
        linters:
          - dupl
      - path: _test\.go
        linters:
          - goconst
      - source: "^//\\+"
        linters:
          - revive

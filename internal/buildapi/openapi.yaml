openapi: 3.0.3
info:
  title: Automotive Build API
  version: 1.0.0
servers:
  - url: /
paths:
  /v1/builds:
    get:
      operationId: listBuilds
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BuildListItem'
                type: array
          description: List of builds
      summary: List builds
    post:
      operationId: createBuild
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
          description: Build accepted
        "400":
          description: Invalid input
        "413":
          description: Operation JSON body exceeds 4 MiB
      summary: Create a build
  /v1/builds/{name}:
    get:
      operationId: getBuild
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
          description: Build status
        "404":
          description: Not found
      summary: Get build status
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
  /v1/builds/{name}/logs:
    get:
      operationId: streamLogs
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Log stream
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: Logs not available yet
      summary: Stream build logs
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - description: If true, stream logs
        in: query
        name: follow
        required: false
        schema:
          type: boolean
  /v1/builds/{name}/progress:
    get:
      description: Returns the current build phase and, for active builds, the latest progress step from build script markers.
      operationId: getBuildProgress
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildProgress'
          description: Build progress
        "404":
          description: Not found
      summary: Get build progress
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
  /v1/builds/{name}/template:
    get:
      operationId: getBuildTemplate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTemplateResponse'
          description: Build template
        "404":
          description: Not found
      summary: Get a build's inputs as a template
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
  /v1/builds/{name}/uploads:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    post:
      operationId: uploadFiles
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                type: object
          description: Upload complete
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: Upload pod not ready
      summary: Upload local files referenced by manifest
  /v1/flash:
    get:
      operationId: listFlashes
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FlashListItem'
                type: array
          description: Standalone flashes
      summary: List standalone flashes
    post:
      operationId: createFlash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlashRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashResponse'
          description: Flash accepted
        "400":
          description: Invalid input
        "413":
          description: Operation JSON body exceeds 4 MiB
      summary: Create a standalone flash
  /v1/flash/{name}:
    get:
      operationId: getFlash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashResponse'
          description: Flash status
        "404":
          description: Not found
      summary: Get standalone flash status
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
  /v1/healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
      summary: Health check
  /v1/workspaces/{name}/runs:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    get:
      operationId: listWorkspaceRuns
      summary: List retained workspace runs, newest first
      description: Requires workspace ownership and a running workspace. Deleted or expired runs are omitted.
      parameters:
        - in: query
          name: offset
          description: Number of runs to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Retained runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceRun'
        "400":
          description: Invalid pagination
        "401":
          description: Authentication required
        "404":
          description: Workspace not found or owned by another user
        "409":
          description: Start the workspace to access retained runs
        "422":
          description: Unreadable run record, or the image cannot execute the helper (Python 3.12 or newer required)
    post:
      operationId: createWorkspaceRun
      summary: Start a durable workspace command
      description: |
        Requires workspace ownership and a running workspace. The command runs
        in /workspace/src independently of the HTTP request. An optional client
        ID makes retries idempotent; reuse with a different command or requested
        timeout returns 409. IDs are single-use: generate a fresh ID for each new
        command. Deleted or expired IDs return 410 for a 24-hour retry window;
        idempotency is no longer guaranteed after that window. The operator controls timeout defaults/caps, log retention and
        storage budgets. Only timeoutSeconds may be overridden per run.
        By default commands time out after 2 hours (maximum 24 hours), keep the
        last 100 MiB of output and expire after 7 days. At most the newest 1,000
        terminal records are retained; operators can lower this cap and configure
        retention up to 30 days. Live runs do not count against the record cap.
        Completed logs are pruned oldest first to a budget of min(1 GiB, 10% of
        the PVC); live runs are
        never evicted. Budget eviction removes only logs, sets logsEvicted and
        retains status and exit code until the age or record count limit is reached.
        The per-log cap cannot exceed the completed-log budget. Pruning runs during creation and
        after completion. Unreadable records are skipped by collection operations.
        Newer record versions expose only their stable lifecycle envelope. They
        remain listable, participate in activity checks and, when finished, can
        be deleted or pruned by age/count. Their payloads are never rewritten and
        their logs are excluded from log-budget eviction. An invalid newer
        envelope reports Unknown and prevents auto-pause and deletion without
        blocking unrelated runs. Reusing a newer record's ID returns 409.
        The helper program and request
        data use pod exec stdin, keeping command contents out of exec request URLs.
        Stale runs report Interrupted even when persisting that transition fails.
        The request body is limited to 128 KiB and the command to 65536 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRunRequest'
      responses:
        "202":
          description: Run accepted, or the existing run for an idempotent retry
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRun'
        "400":
          description: Invalid command, ID, timeout, or request body
        "401":
          description: Authentication required
        "404":
          description: Workspace not found or owned by another user
        "409":
          description: Workspace is stopped, or ID belongs to another command, timeout or unsupported record version
        "410":
          description: Run ID was deleted or expired; use a new ID for a new command
        "422":
          description: Unreadable run record, or the image cannot execute the helper (Python 3.12 or newer required)
        "502":
          description: Pod operation failed; retry creation with the same ID
        "503":
          description: Could not read operator limits or reserve workspace activity; retry with the same ID
  /v1/workspaces/{name}/runs/{run}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: path
        name: run
        required: true
        schema:
          type: string
    get:
      operationId: getWorkspaceRun
      summary: Get a workspace command's retained result
      description: |
        Requires workspace ownership. Start a stopped workspace to read its
        retained records. Runs whose supervisor or container disappeared are
        reported as Interrupted without inventing an exit code.
        Newer formats return lifecycle metadata with a compatibility message;
        their command, exit code, timeout and log metadata are unavailable.
        For a stale newer supervisor, finishedAt uses the record's modification
        time as a stable retention timestamp, not the exact crash time.
        An invalid newer envelope reports Unknown with no timestamps.
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRun'
        "401":
          description: Authentication required
        "404":
          description: Workspace or run not found, or workspace not owned
        "409":
          description: Start the workspace to access retained runs
        "410":
          description: Run was deleted or expired
        "422":
          description: Unreadable run record, or the image cannot execute the run helper
    delete:
      operationId: deleteWorkspaceRun
      summary: Delete a terminal or unreadable run and its retained log
      description: |
        Requires workspace ownership and a running workspace. Directories with
        unreadable or missing records can be deleted. Readable live runs cannot
        be deleted; cancel and wait for completion first. Repeated deletion is
        safe during the 24-hour tombstone window. A small ID tombstone protects
        retried creation during that window, then expires. IDs are single-use.
        Newer records may be deleted only when their stable envelope confirms
        they are terminal or their supervisor identity is no longer live.
        Invalid newer envelopes cannot be deleted.
      responses:
        "204":
          description: Run deleted, or already deleted
        "401":
          description: Authentication required
        "404":
          description: Workspace or run not found, or workspace not owned
        "409":
          description: Run is live, its newer envelope is invalid, or workspace must be started
        "422":
          description: Unreadable run record, or the image cannot execute the run helper
  /v1/workspaces/{name}/runs/{run}/logs:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: path
        name: run
        required: true
        schema:
          type: string
    get:
      operationId: workspaceRunLogs
      summary: Read or follow resumable command output
      description: |
        Requires workspace ownership and a running workspace. Contains only
        combined stdout/stderr bytes, with no banners or heartbeat text. Resume
        after disconnect by adding bytes received to the X-Log-Offset response
        header. Offsets are absolute, including bytes discarded by log rotation.
        Requests below logStartOffset start at logStartOffset. If the retained
        tail advances past a slow reader during a response, the stream ends with
        X-Log-Error; reconnect to obtain the new starting offset.
        Without follow this returns a snapshot. With follow it ends when the run
        finishes or reaches X-Log-Stream-Seconds (currently at most 40 seconds,
        also bounded by the configured log stream duration); reconnect to
        continue and GET the run to determine its status and exit code. Budget
        eviction leaves an empty log with logStartOffset equal to logBytes and
        preserves the result record.
        An error after headers is reported by the X-Log-Error trailer. Final
        metadata is available in X-Run-Status and X-Run-Exit-Code trailers.
        Unsupported record formats return 409 before starting the stream.
      parameters:
        - in: query
          name: follow
          allowEmptyValue: true
          description: Follow new output; an empty value means true
          schema:
            type: boolean
            default: false
        - in: query
          name: offset
          description: Absolute byte offset from the start of command output
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Raw log bytes
          headers:
            X-Log-Offset:
              description: Actual absolute starting offset, at least the current logStartOffset
              schema:
                type: integer
                format: int64
            X-Log-Stream-Seconds:
              description: Server-side stream cap in seconds; clients should allow a grace period before reconnecting
              schema:
                type: number
                minimum: 0
                exclusiveMinimum: true
          content:
            text/plain:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid offset, follow value, or run ID
        "401":
          description: Authentication required
        "404":
          description: Workspace or run not found, or workspace not owned
        "409":
          description: Workspace must be started or logs require a compatible operator
        "410":
          description: Run was deleted or expired
        "416":
          description: Offset exceeds the available log bytes
        "422":
          description: Unreadable run record, or the image cannot execute the run helper
  /v1/workspaces/{name}/runs/{run}/cancel:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: path
        name: run
        required: true
        schema:
          type: string
    post:
      operationId: cancelWorkspaceRun
      summary: Cancel a workspace command and its process group
      description: |
        Requires workspace ownership and a running workspace. Records a durable
        cancellation request. The supervisor sends SIGTERM, escalating to
        SIGKILL after five seconds. Poll the run for its final result. Repeated
        cancellation is safe and does not change an already completed result.
        Newer record formats return 409 without modifying the record.
      responses:
        "200":
          description: Cancellation requested, or run already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRun'
        "401":
          description: Authentication required
        "404":
          description: Workspace or run not found, or workspace not owned
        "409":
          description: Workspace must be started or cancellation requires a compatible operator
        "410":
          description: Run was deleted or expired
        "422":
          description: Unreadable run record, or the image cannot execute the run helper
components:
  schemas:
    WorkspaceRunRequest:
      type: object
      required: [command]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          description: Optional single-use idempotency ID; generated when omitted. Reuse only to retry the same command. Deleted IDs are protected for 24 hours.
        command:
          type: string
          minLength: 1
          maxLength: 65536
          description: Shell command, limited to 65536 bytes and containing no NUL
        timeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
          description: Positive command timeout within the operator cap; omitted or zero uses the operator default (normally 7200 seconds)
    WorkspaceRun:
      type: object
      description: |
        Newer record formats expose only lifecycle metadata with a compatibility
        message. Empty command and zero timeout/log fields are placeholders, not
        payload metadata. Unknown indicates an invalid newer envelope; it prevents
        auto-pause and has no timestamps or exit code.
      required: [id, command, status, logBytes, logStartOffset, logTruncated, logsEvicted, timeoutSeconds]
      properties:
        id:
          type: string
        command:
          type: string
        status:
          type: string
          enum: [Starting, Running, Cancelling, Succeeded, Failed, Cancelled, Interrupted, TimedOut, Unknown]
        exitCode:
          type: integer
          description: Omitted while live, interrupted without a recorded result, or when the record format is unsupported; a supported timeout records 124
        startedAt:
          type: string
          format: date-time
          description: Omitted when a newer record's envelope is invalid
        finishedAt:
          type: string
          format: date-time
        logBytes:
          type: integer
          format: int64
          minimum: 0
          description: Absolute end offset (total bytes produced), including discarded bytes
        logStartOffset:
          type: integer
          format: int64
          minimum: 0
          description: Absolute offset of the first retained byte
        logTruncated:
          type: boolean
          description: Earlier output was discarded by the log cap or completed-log budget
        logsEvicted:
          type: boolean
          description: Completed-log budget removed output; status and exit code remain until retention expires
        timeoutSeconds:
          type: integer
          format: int64
          description: Effective timeout fixed when the run was created
        message:
          type: string
    ArtifactStatus:
      description: ArtifactStatus describes an output actually published by a build stage.
      properties:
        digest:
          description: Digest is the OCI digest or a checksum of uploaded bytes, never an S3 ETag.
          pattern: ^sha256:[a-f0-9]{64}$
          type: string
        kind:
          enum:
            - container
            - disk
            - s3
          type: string
        url:
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - kind
        - url
      type: object
    BuildCallback:
      description: Endpoint and signing key are write-only. No callback URL, key, or backing Secret name is returned in operation responses.
      properties:
        secret:
          description: Standard base64 of 32–4096 random bytes. Decoded length is validated; bytes are never trimmed.
          format: byte
          maxLength: 5464
          minLength: 44
          type: string
          writeOnly: true
        url:
          format: uri
          maxLength: 2048
          pattern: ^https://[^/@#\s]+[^#\s]*$
          type: string
          writeOnly: true
      required:
        - url
        - secret
      type: object
      writeOnly: true
    BuildListItem:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactStatus'
          maxItems: 64
          type: array
        completionTime:
          format: date-time
          type: string
        containerImage:
          type: string
        createdAt:
          format: date-time
          type: string
        diskImage:
          type: string
        lockfileArtifact:
          description: Published lockfile artifact reference for resolve-only operations
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        flash:
          $ref: '#/components/schemas/FlashOutcomeStatus'
        message:
          type: string
        name:
          type: string
        notification:
          $ref: '#/components/schemas/NotificationStatus'
        phase:
          enum:
            - Pending
            - Uploading
            - Building
            - Pushing
            - Flashing
            - Completed
            - Failed
            - Cancelled
            - Expired
          type: string
        requestedBy:
          nullable: true
          type: string
        startTime:
          format: date-time
          type: string
      type: object
    BuildParameters:
      description: Key input parameters that produced an ImageBuild
      properties:
        architecture:
          type: string
        automotiveImageBuilder:
          type: string
        buildDiskImage:
          type: boolean
        builderImage:
          type: string
        compression:
          type: string
        containerRef:
          type: string
        distro:
          type: string
        exportFormat:
          type: string
        flashEnabled:
          type: boolean
        flashLeaseDuration:
          type: string
        flashLeaseName:
          type: string
        mode:
          type: string
        storageClass:
          type: string
        target:
          type: string
        useServiceAccountAuth:
          type: boolean
      type: object
    BuildProgress:
      properties:
        phase:
          description: ImageBuild phase (Pending, Building, Completed, Failed, etc.)
          type: string
        step:
          $ref: '#/components/schemas/BuildStep'
      required:
        - phase
      type: object
    GitSource:
      type: object
      required: [url, manifestPath]
      properties:
        url:
          type: string
          description: HTTPS Git URL without embedded credentials.
        revision:
          type: string
          description: Branch, tag, or commit; defaults to remote HEAD.
        manifestPath:
          type: string
          description: Repository-relative manifest path. An adjacent lockfile named after the manifest (for example, simple.aib.lock for simple.aib.yml) is used when present.
        lockfilePath:
          type: string
          description: Optional repository-relative lockfile path. When set, the file must exist in the selected commit; otherwise, the adjacent manifest-named lockfile is used when present.
        credentialsSecretRef:
          type: string
          description: Namespace-local basic-auth Secret annotated with the requesting user's identity.
    BuildRequest:
      description: 'Operation request limit: 4 MiB before JSON binding. Correlation and callbacks apply to existing build inputs.'
      properties:
        gitSource:
          $ref: '#/components/schemas/GitSource'
        aibExtraArgs:
          items:
            type: string
          nullable: true
          type: array
        architecture:
          type: string
        architectureFallback:
          type: string
          description: Optional CLI architecture used for Git sources only when the target has no default and architecture is not explicit.
        automotiveImageBuilder:
          type: string
        buildDiskImage:
          type: boolean
        builderImage:
          type: string
        callback:
          allOf:
            - $ref: '#/components/schemas/BuildCallback'
          writeOnly: true
        compression:
          type: string
        containerPush:
          type: string
        containerRef:
          type: string
        customDefs:
          items:
            type: string
          nullable: true
          type: array
        distro:
          type: string
        exportFormat:
          type: string
        exportOci:
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        extraRepos:
          items:
            type: string
          type: array
        flashClientConfig:
          type: string
          writeOnly: true
        flashCmd:
          type: string
        flashEnabled:
          type: boolean
        flashExporterSelector:
          type: string
        flashLeaseDuration:
          type: string
        flashLeaseName:
          type: string
        flashLeaseTags:
          type: string
        hasLocalFiles:
          type: boolean
        internalRegistryImageName:
          description: Override image name for internal registry (default is build name)
          type: string
        internalRegistryTag:
          description: Tag for internal registry image (default is build name)
          type: string
        localRepo:
          type: boolean
        manifest:
          description: Inline AIB YAML. Maximum 900 KiB UTF-8 bytes.
          maxLength: 921600
          type: string
        resolveOnly:
          type: boolean
          description: Generate a lockfile on the cluster without assembling an image; requires package mode.
        lockfile:
          type: string
          maxLength: 921600
          description: AIB JSON lockfile contents generated by resolve; unsupported in disk mode. Manifest and lockfile share a 921600-byte UTF-8 aggregate limit.
        manifestFileName:
          default: manifest.aib.yml
          type: string
        mode:
          description: Omission uses the server default.
          enum:
            - package
            - image
            - bootc
            - disk
            - ""
          type: string
        name:
          type: string
        ociRepoImages:
          items:
            type: string
          type: array
        pushRepository:
          type: string
        rebuildBuilder:
          type: boolean
        builderCachePolicy:
          description: Validate helper freshness online (default), or reuse a cached digest without depsolving. Cache misses build online; rebuildBuilder overrides this policy.
          type: string
          enum: [validate, reuse]
          default: validate
        registryCredentials:
          allOf:
            - $ref: '#/components/schemas/RegistryCredentials'
          writeOnly: true
        reproducible:
          type: boolean
        restoreSourcesRef:
          type: string
        rootPassword:
          type: string
          writeOnly: true
        s3Bucket:
          type: string
        s3Credentials:
          allOf:
            - $ref: '#/components/schemas/S3Credentials'
          writeOnly: true
        s3CredentialsSecretName:
          type: string
        s3Endpoint:
          type: string
        s3InsecureSkipTLSVerify:
          type: boolean
        s3Prefix:
          type: string
        s3Region:
          type: string
        secureBuild:
          description: Use digest-pinned Tekton tasks and locked inputs for network-isolated AIB assembly. OCI output requires a registry that supports referrers.
          type: boolean
        storageClass:
          type: string
        target:
          type: string
        taskBundleRef:
          type: string
        ttl:
          description: Time-to-live for the build (e.g. "24h", "72h"). Empty uses server default, "0" disables expiry.
          type: string
        useInternalRegistry:
          description: Push disk images to OpenShift internal registry (mutually exclusive with exportOci; not supported for secure builds because required OCI referrers cannot be published)
          type: boolean
        workspace:
          type: string
      required:
        - name
      type: object
    BuildResponse:
      description: Newly accepted builds report Pending. Outcomes are populated as work completes.
      properties:
        gitSource:
          $ref: '#/components/schemas/GitSource'
        sourceCommit:
          type: string
          description: Resolved Git commit used for this build.
        architectureSource:
          type: string
          description: How the Git build architecture was selected (explicit, target-default, client-fallback, or operator-fallback).
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactStatus'
          maxItems: 64
          type: array
        completionTime:
          description: When the build completed (RFC 3339)
          format: date-time
          type: string
        cost:
          $ref: '#/components/schemas/BuildCost'
        containerImage:
          description: Container image reference for the built image
          type: string
        diskImage:
          description: Disk image artifact reference
          type: string
        lockfileArtifact:
          description: Published lockfile artifact reference for resolve-only operations
          type: string
        expiresAt:
          description: When terminal build resources expire. The ImageBuild and its terminal result remain.
          format: date-time
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        flash:
          $ref: '#/components/schemas/FlashOutcomeStatus'
        jumpstarter:
          $ref: '#/components/schemas/JumpstarterInfo'
        message:
          type: string
        name:
          type: string
        notification:
          $ref: '#/components/schemas/NotificationStatus'
        parameters:
          $ref: '#/components/schemas/BuildParameters'
        phase:
          enum:
            - Pending
            - Uploading
            - Building
            - Pushing
            - Flashing
            - Completed
            - Failed
            - Cancelled
            - Expired
          type: string
        registryToken:
          description: Short-lived token for pulling from internal registry
          type: string
        requestedBy:
          nullable: true
          type: string
        startTime:
          description: When the build started (RFC 3339)
          format: date-time
          type: string
        traceId:
          description: OTel trace ID for cross-pod log and trace correlation
          type: string
        warning:
          description: Non-fatal warnings (e.g. token expiry notices)
          type: string
      type: object
    BuildStep:
      description: A progress checkpoint emitted by the build script
      properties:
        done:
          description: Number of steps completed
          type: integer
        stage:
          description: Human-readable stage name
          type: string
        total:
          description: Total number of steps
          type: integer
      required:
        - stage
        - done
        - total
      type: object
    BuildTemplateResponse:
      allOf:
        - properties:
            gitSource:
              $ref: '#/components/schemas/GitSource'
            aibExtraArgs:
              items:
                type: string
              type: array
            architecture:
              type: string
            automotiveImageBuilder:
              type: string
            buildDiskImage:
              type: boolean
            builderImage:
              type: string
            compression:
              type: string
            containerPush:
              type: string
            containerRef:
              type: string
            customDefs:
              items:
                type: string
              type: array
            distro:
              type: string
            exportFormat:
              type: string
            exportOci:
              type: string
            externalId:
              $ref: '#/components/schemas/ExternalID'
            extraRepos:
              items:
                type: string
              type: array
            flashCmd:
              type: string
            flashEnabled:
              type: boolean
            flashExporterSelector:
              type: string
            flashLeaseDuration:
              type: string
            flashLeaseName:
              type: string
            flashLeaseTags:
              type: string
            hasLocalFiles:
              type: boolean
            internalRegistryImageName:
              description: Override image name for internal registry (default is build name)
              type: string
            internalRegistryTag:
              description: Tag for internal registry image (default is build name)
              type: string
            localRepo:
              type: boolean
            manifest:
              description: Inline AIB YAML. Maximum 900 KiB UTF-8 bytes.
              maxLength: 921600
              type: string
            resolveOnly:
              type: boolean
              description: Generate a lockfile on the cluster without assembling an image; requires package mode.
            lockfile:
              type: string
              maxLength: 921600
              description: AIB JSON lockfile contents generated by resolve; unsupported in disk mode. Manifest and lockfile share a 921600-byte UTF-8 aggregate limit.
            manifestFileName:
              default: manifest.aib.yml
              type: string
            mode:
              description: Omission uses the server default.
              enum:
                - package
                - image
                - bootc
                - disk
              type: string
            name:
              type: string
            ociRepoImages:
              items:
                type: string
              type: array
            pushRepository:
              type: string
            rebuildBuilder:
              type: boolean
            builderCachePolicy:
              description: Validate helper freshness online (default), or reuse a cached digest without depsolving. Cache misses build online; rebuildBuilder overrides this policy.
              type: string
              enum: [validate, reuse]
              default: validate
            reproducible:
              type: boolean
            restoreSourcesRef:
              type: string
            s3Bucket:
              type: string
            s3CredentialsSecretName:
              type: string
            s3Endpoint:
              type: string
            s3InsecureSkipTLSVerify:
              type: boolean
            s3Prefix:
              type: string
            s3Region:
              type: string
            secureBuild:
              description: Use digest-pinned Tekton tasks and locked inputs for network-isolated AIB assembly. OCI output requires a registry that supports referrers.
              type: boolean
            storageClass:
              type: string
            target:
              type: string
            taskBundleRef:
              type: string
            ttl:
              description: Time-to-live for the build (e.g. "24h", "72h"). Empty uses server default, "0" disables expiry.
              type: string
            useInternalRegistry:
              description: Push disk images to OpenShift internal registry (mutually exclusive with exportOci; not supported for secure builds because required OCI referrers cannot be published)
              type: boolean
            workspace:
              type: string
          type: object
        - properties:
            createdAt:
              format: date-time
              type: string
            message:
              type: string
            phase:
              type: string
            sourceFiles:
              items:
                type: string
              type: array
          type: object
    BuildTerminalEvent:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactStatus'
          maxItems: 64
          type: array
        completedAt:
          format: date-time
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        flash:
          $ref: '#/components/schemas/FlashOutcomeStatus'
        message:
          maxLength: 1024
          type: string
        name:
          maxLength: 253
          minLength: 1
          type: string
        phase:
          enum:
            - Completed
            - Failed
            - Cancelled
          type: string
        startedAt:
          format: date-time
          type: string
        traceId:
          type: string
      required:
        - name
        - completedAt
        - message
        - phase
      type: object
    BuildTerminalResult:
      description: BuildTerminalResult remains unchanged when the display phase later becomes Expired.
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactStatus'
          maxItems: 64
          type: array
        completedAt:
          format: date-time
          type: string
        flash:
          $ref: '#/components/schemas/FlashOutcomeStatus'
        message:
          maxLength: 1024
          type: string
        phase:
          enum:
            - Completed
            - Failed
            - Cancelled
          type: string
        startedAt:
          format: date-time
          type: string
      required:
        - completedAt
        - message
        - phase
      type: object
    ExternalID:
      description: Opaque caller correlation value; maximum 512 UTF-8 bytes.
      maxLength: 512
      pattern: ^[^\x00-\x1f\x7f]*$
      type: string
    FlashListItem:
      properties:
        completionTime:
          type: string
        createdAt:
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        message:
          type: string
        name:
          type: string
        notification:
          $ref: '#/components/schemas/NotificationStatus'
        phase:
          type: string
        requestedBy:
          type: string
      type: object
    BuildCost:
      description: >-
        Resources consumed by the build step. A field is absent when the step
        could not measure it, which is distinct from zero. Measurements remain
        available if a later push or flash stage fails. Check phase for the
        overall build outcome.
      properties:
        artifactBytes:
          description: Compressed size of the exported artifact as published, the disk image when one was built, otherwise the container image. Not the number of bytes written to a device.
          format: int64
          minimum: 0
          type: integer
        downloadedBytes:
          description: Bytes the build pod received over the network.
          format: int64
          minimum: 0
          type: integer
        peakWorkspaceBytes:
          description: Peak used space on the build workspace volume.
          format: int64
          minimum: 0
          type: integer
      type: object
    FlashOutcomeStatus:
      description: FlashOutcomeStatus excludes device credentials and command configuration.
      properties:
        enabled:
          type: boolean
        leaseId:
          maxLength: 253
          type: string
        message:
          maxLength: 1024
          type: string
        state:
          enum:
            - NotStarted
            - Running
            - Succeeded
            - Failed
            - Cancelled
          type: string
      required:
        - enabled
        - state
      type: object
    FlashRequest:
      properties:
        callback:
          allOf:
            - $ref: '#/components/schemas/BuildCallback'
          writeOnly: true
        catalogImage:
          type: string
        clientConfig:
          type: string
          writeOnly: true
        exporterSelector:
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        flashCmd:
          type: string
        imageRef:
          type: string
        leaseDuration:
          type: string
        leaseName:
          type: string
        leaseTags:
          type: string
        name:
          type: string
        registryCredentials:
          allOf:
            - $ref: '#/components/schemas/RegistryCredentials'
          writeOnly: true
        target:
          type: string
      required:
        - clientConfig
      type: object
    FlashResponse:
      properties:
        completionTime:
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        leaseId:
          type: string
        message:
          type: string
        name:
          type: string
        notification:
          $ref: '#/components/schemas/NotificationStatus'
        phase:
          type: string
        requestedBy:
          type: string
        startTime:
          type: string
        taskRunName:
          type: string
      type: object
    FlashTerminalEvent:
      properties:
        completedAt:
          format: date-time
          type: string
        externalId:
          $ref: '#/components/schemas/ExternalID'
        imageRef:
          maxLength: 2048
          type: string
        leaseId:
          maxLength: 253
          type: string
        message:
          maxLength: 1024
          type: string
        name:
          maxLength: 253
          minLength: 1
          type: string
        phase:
          enum:
            - Completed
            - Failed
            - Cancelled
          type: string
        startedAt:
          format: date-time
          type: string
        traceId:
          type: string
      required:
        - name
        - phase
        - message
        - imageRef
        - completedAt
      type: object
    JumpstarterInfo:
      description: Information about Jumpstarter device flashing availability
      properties:
        available:
          description: Whether Jumpstarter is installed in the cluster
          type: boolean
        exporterSelector:
          description: Label selector for matching Jumpstarter exporters
          type: string
        flashCmd:
          description: Command for flashing the device
          type: string
        leaseId:
          description: Jumpstarter lease ID acquired during flash
          type: string
      type: object
    NotificationStatus:
      properties:
        attempts:
          format: int32
          maximum: 1000
          minimum: 0
          type: integer
        completionTime:
          format: date-time
          type: string
        lastAttemptTime:
          format: date-time
          type: string
        lastError:
          description: Sanitized diagnostic; never an HTTP response body or raw transport error.
          maxLength: 1024
          type: string
        lastHttpStatus:
          maximum: 599
          minimum: 100
          type: integer
        nextAttemptTime:
          format: date-time
          type: string
        state:
          enum:
            - Pending
            - Delivering
            - Delivered
            - Failed
          type: string
      required:
        - state
        - attempts
      type: object
    RegistryCredentials:
      properties:
        authType:
          type: string
        dockerConfig:
          type: string
        enabled:
          type: boolean
        password:
          type: string
        registryUrl:
          type: string
        token:
          type: string
        username:
          type: string
      type: object
    S3Credentials:
      properties:
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
      type: object
    TerminalEvent:
      description: 'Maximum encoded JSON payload: 256 KiB. A stable event ID and exact payload bytes are reused on every delivery attempt. Expiry does not produce another terminal event.'
      oneOf:
        - not:
            anyOf:
              - required:
                  - flash
          properties:
            type:
              enum:
                - build.terminal
              type: string
          required:
            - build
        - not:
            anyOf:
              - required:
                  - build
          properties:
            type:
              enum:
                - flash.terminal
              type: string
          required:
            - flash
      properties:
        apiVersion:
          enum:
            - notifications.caib.dev/v1alpha1
          type: string
        build:
          $ref: '#/components/schemas/BuildTerminalEvent'
        flash:
          $ref: '#/components/schemas/FlashTerminalEvent'
        id:
          maxLength: 128
          minLength: 1
          type: string
        time:
          format: date-time
          type: string
        type:
          enum:
            - build.terminal
            - flash.terminal
          type: string
      required:
        - apiVersion
        - id
        - type
        - time
      type: object

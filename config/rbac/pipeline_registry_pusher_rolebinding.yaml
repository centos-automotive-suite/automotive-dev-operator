# Image pull and push only, for build pods (ado-build) and the token in each
# build's registry-auth Secret (ado-registry). OpenShift's registry-editor
# would also grant every verb on Secrets, which lets a build create a token
# Secret for any ServiceAccount in the namespace, including the operator's.
# Tokens handed to users are pull-only (pipeline_registry_puller_rolebinding.yaml).
# Pushes cannot create ImageStreams: the build API creates build and reseal
# output streams, and the operator creates the builder cache stream (aib-build).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-image-pusher
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-pusher
subjects:
- kind: ServiceAccount
  name: ado-build
- kind: ServiceAccount
  name: ado-registry

# Image pull only, for the registry tokens handed to users (caib image token,
# build status) and to flash jobs (ado-registry-pull). Push rights would let
# any user overwrite tags in shared streams, such as the builder cache that
# every build pulls from.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-image-puller
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: ado-registry-pull

name: Lint and Test

on:
  pull_request:
    branches:
      - main
      - "release-*"
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: make lint-shell

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: make golangci-lint

      - name: Run golangci-lint
        run: make lint

      - name: Verify no lint issues
        run: |
          OUTPUT=$(make lint 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "^[1-9][0-9]* issues"; then
            ISSUES=$(echo "$OUTPUT" | grep -E "^[0-9]+ issues" | cut -d' ' -f1)
            echo "❌ Found $ISSUES lint issues - PR cannot be merged"
            exit 1
          else
            echo "✅ No lint issues found - great job!"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: make test

      - name: Run fmt check
        run: |
          make fmt
          if [ -n "$(git diff --name-only)" ]; then
            echo "❌ Code is not properly formatted. Run 'make fmt' and commit the changes."
            git diff
            exit 1
          fi

      - name: Run vet check
        run: make vet

      - name: Generate and check manifests
        run: |
          make manifests generate
          if [ -n "$(git diff --name-only)" ]; then
            echo "❌ Generated files are out of date. Run 'make manifests generate' and commit the changes."
            git diff --name-only
            exit 1
          fi

  validate-bundle:
    name: Validate OLM Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install operator-sdk
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
          OS=$(uname | awk '{print tolower($0)}')
          OPERATOR_SDK_DL_URL=https://github.com/operator-framework/operator-sdk/releases/download/v1.42.0
          curl -LO "${OPERATOR_SDK_DL_URL}/operator-sdk_${OS}_${ARCH}"
          chmod +x "operator-sdk_${OS}_${ARCH}"
          sudo mv "operator-sdk_${OS}_${ARCH}" /usr/local/bin/operator-sdk

      - name: Generate bundle
        run: make bundle VERSION=0.0.1-dev

      - name: Validate bundle
        run: |
          operator-sdk bundle validate ./bundle
          operator-sdk bundle validate ./bundle --select-optional name=operatorhubv2
          operator-sdk bundle validate ./bundle --select-optional name=capabilities
          operator-sdk bundle validate ./bundle --select-optional name=categories